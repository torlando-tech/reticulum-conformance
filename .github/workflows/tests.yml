name: Conformance Tests

# Runs the conformance suite on every PR to this repo so a failing test
# can't land on main and poison downstream consumers (reticulum-kt,
# reticulum-swift). This mirrors reticulum-kt's conformance job so PR
# authors here see the same signal CI will emit after merge.
#
# The suite has TWO independent passes, run as PARALLEL jobs (no
# `needs:` between them) so they overlap on separate runners instead of
# running back-to-back:
#
#   * conformance-kotlin     --impl=kotlin        (~45 min; the bottleneck)
#   * conformance-reference  --reference-only     (~12 min)
#
# Wall time is therefore the SLOWER pass (~45 min), not the sum (~57 min).
# The passes are independent: the kotlin pass uses a Kotlin JVM bridge for the
# kotlin peer, the reference pass uses the Python RNS reference for both peers;
# neither consumes the other's output.
#
# WITHIN each pass the tests still run SERIALLY (no pytest-xdist -n): a pool of
# real-time-assertion tests (keepalive RTT clamp, link watchdog, channel
# window-rate, bz2 timing) flakes under parallel CPU contention on the 2-vCPU
# ubuntu-latest runners - the JVM bridges get starved and their timers drift.
# Parallelizing ACROSS the two passes is safe because it does not add contention
# inside a pass.
#
# Per-impl bridge env vars (CONFORMANCE_KOTLIN_BRIDGE_CMD etc.) are
# required - the legacy CONFORMANCE_BRIDGE_CMD global override silently
# forces every peer to the same bridge, masking any xfail keyed off
# transport_impl / sender_impl / receiver_impl.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Pass 1: Kotlin under test. Cross-impl (kotlin-to-reference, kotlin-to-kotlin,
  # reference-to-kotlin) plus the reference-to-reference legs, with a Kotlin JVM
  # bridge as the SUT. Needs the reticulum-kt checkout + JDK + Gradle to build
  # the conformance-bridge JAR. This is the slow pass (~45 min).
  conformance-kotlin:
    name: Conformance (kotlin SUT)
    runs-on: ubuntu-latest
    # ~45 min serial kotlin pass + ~5 min setup/bridge build = ~50 min expected.
    # 75 min leaves comfortable margin for a slow runner or a flaky long tail
    # (the pre-split single job had a 90-minute limit; this pass is the slower
    # of the two so 75 min is tighter but still well above the ~50 min expected).
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          path: reticulum-conformance

      - uses: actions/checkout@v4
        with:
          repository: torlando-tech/reticulum-kt
          path: reticulum-kt

      # Pin RNS/LXMF to the audited release tags (RNS 1.3.1 / LXMF 0.9.9)
      # rather than tracking master HEAD. Without ref: CI silently validated
      # against whatever upstream master happened to be, not the ground-truth
      # release the suite was audited against (N-M16).
      - uses: actions/checkout@v4
        with:
          repository: markqvist/Reticulum
          ref: "1.3.1"
          path: Reticulum

      - uses: actions/checkout@v4
        with:
          repository: markqvist/LXMF
          ref: "0.9.9"
          path: LXMF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # `cryptography` is required by the pyca-provider equivalence tests
        # (crypto_provider_op imports RNS.Cryptography.Proxies, the OpenSSL/PyCA
        # backend). Without it the reference leg errors on those tests. It is
        # also a hard RNS runtime dependency, so installing it makes the
        # reference bridge's `import RNS` exercise the same provider real
        # deployments use, rather than only the pure-Python fallback.
        run: pip install pytest pytest-xdist cryptography msgpack u-msgpack-python

      - name: Assert RNS/LXMF versions match audited ground truth (1.3.1 / 0.9.9)
        # Shared guard (tools/check_rns_lxmf_versions.py) run by BOTH the kotlin
        # and reference jobs so the version check lives in one place. Reads
        # __version__ from the pinned checkouts' _version.py without a full
        # `import RNS` (which needs cryptography/pyserial). A mismatch means the
        # ref: pins drifted from the audited ground truth, so it fails loudly
        # regardless of which job is inspected first (N-M16).
        working-directory: reticulum-conformance
        env:
          PYTHON_RNS_PATH: ${{ github.workspace }}/Reticulum
          PYTHON_LXMF_PATH: ${{ github.workspace }}/LXMF
        run: python3 -m tools.check_rns_lxmf_versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin conformance bridge
        working-directory: reticulum-kt
        run: ./gradlew :conformance-bridge:shadowJar

      - name: Run cross-impl conformance tests (--impl=kotlin)
        working-directory: reticulum-conformance
        env:
          # Per-impl bridge commands. Kotlin peers use the JAR built
          # above; reference peers use the default Python bridge
          # configured in conftest.py BRIDGE_COMMANDS. DO NOT set the
          # legacy CONFORMANCE_BRIDGE_CMD - it applies globally and
          # silently breaks cross-impl parametrization.
          CONFORMANCE_KOTLIN_BRIDGE_CMD: java -jar ${{ github.workspace }}/reticulum-kt/conformance-bridge/build/libs/ConformanceBridge.jar
          PYTHON_RNS_PATH: ${{ github.workspace }}/Reticulum
          PYTHON_LXMF_PATH: ${{ github.workspace }}/LXMF
        # The legacy `--ignore=tests/lxmf` was a no-op - tests/lxmf/ no longer
        # exists in this repo - so it has been dropped (L18).
        # SERIAL (no -n): a pool of real-time-assertion tests (keepalive RTT
        # clamp, link watchdog, bz2 timing, channel window-rate) flakes under
        # xdist CPU contention on slow runners - the JVM bridges get starved and
        # their timers drift. They pass serially. Serial removes the contention
        # with no reruns and no masking, at the cost of a slower run.
        run: python3 -m pytest tests/ --impl=kotlin -v --tb=short

  # Pass 2: Python reference under test. The reference should always pass every
  # test on its own, with no xfails - a red here means either a test is broken
  # or something drifted in Python RNS, either way a signal worth catching
  # before shipping. Uses ONLY the Python bridge, so it does not need the
  # reticulum-kt checkout, JDK, Gradle, or the conformance-bridge build. Serial
  # like the kotlin pass. This is the fast pass (~12 min).
  conformance-reference:
    name: Conformance (reference SUT)
    runs-on: ubuntu-latest
    # ~12 min serial reference pass + ~1-2 min setup (no bridge build).
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          path: reticulum-conformance

      # Pin RNS/LXMF to the audited release tags (RNS 1.3.1 / LXMF 0.9.9).
      - uses: actions/checkout@v4
        with:
          repository: markqvist/Reticulum
          ref: "1.3.1"
          path: Reticulum

      - uses: actions/checkout@v4
        with:
          repository: markqvist/LXMF
          ref: "0.9.9"
          path: LXMF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # cryptography is a hard RNS runtime dependency and is required by the
        # pyca-provider equivalence tests; see the kotlin job for the rationale.
        run: pip install pytest cryptography msgpack u-msgpack-python

      - name: Assert RNS/LXMF versions match audited ground truth (1.3.1 / 0.9.9)
        # Shared guard (tools/check_rns_lxmf_versions.py), the same step the
        # kotlin job runs, so the version check lives in one place.
        working-directory: reticulum-conformance
        env:
          PYTHON_RNS_PATH: ${{ github.workspace }}/Reticulum
          PYTHON_LXMF_PATH: ${{ github.workspace }}/LXMF
        run: python3 -m tools.check_rns_lxmf_versions

      - name: Run reference-only baseline
        # The behavioral [reference] leg + two announce-cap reference tests
        # were previously scoped out here: this baseline had never run in CI
        # (a failing kotlin step always skipped it), hiding pre-existing
        # breakage in the reference bridge under --reference-only (Reticulum
        # double-init + a no-transport minimal instance for forwarding tests).
        # That is now FIXED in reference/bridge_server.py (adopt the running
        # Reticulum singleton; build a transport-enabled instance where
        # forwarding is needed), so the full baseline runs again - no scope-out.
        working-directory: reticulum-conformance
        env:
          PYTHON_RNS_PATH: ${{ github.workspace }}/Reticulum
          PYTHON_LXMF_PATH: ${{ github.workspace }}/LXMF
        run: python3 -m pytest tests/ --reference-only -v --tb=short
